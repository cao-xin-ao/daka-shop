      function revokeCatalogMaterialUrl() {
        if (catalogMaterialObjectUrl) {
          try { URL.revokeObjectURL(catalogMaterialObjectUrl); } catch (e) {}
          catalogMaterialObjectUrl = null;
        }
      }

      function renderCatalogMaterialPage() {
        var material = ui.catalogMaterial;
        var item = material ? getLibraryItemById(material.itemId) : null;
        if (!item) {
          revokeCatalogMaterialUrl();
          ui.catalogMaterial = null;
          return renderCatalogBookDetail(ui.catalogBookId);
        }
        var book = getCatalogBookById(material.bookId) || getCatalogBookById(ui.catalogBookId);
        var entry = getCatalogEntryById(material.entryId);
        var body = '';
        revokeCatalogMaterialUrl();

        if (item.type === 'pdf') {
          try {
            catalogMaterialObjectUrl = URL.createObjectURL(dataUrlToBlob(item.dataUrl));
            body = '<iframe class="catalog-preview-frame" src="' + escapeHtml(catalogMaterialObjectUrl) + '" title="' + escapeHtml(item.name) + '"></iframe>';
          } catch (e) {
            body = '<div class="catalog-empty">PDF 数据无法预览，请到资料库重新上传。</div>';
          }
        } else if (item.type === 'image') {
          body = '<img class="catalog-preview-image" src="' + escapeHtml(item.dataUrl) + '" alt="' + escapeHtml(item.name) + '">';
        } else {
          body = '<div class="catalog-preview-note">' + escapeHtml(item.text || '') + '</div>';
        }

        return '<div class="catalog-material-page">' +
          '<div class="catalog-detail-head">' +
            '<button type="button" class="icon-btn" data-action="catalog-material-back" aria-label="返回本书目录">' + icon('i-chevron-left') + '</button>' +
            '<div class="catalog-detail-title">' + escapeHtml(item.name) + '</div>' +
            '<span style="width:36px;flex:0 0 auto"></span>' +
          '</div>' +
          body +
          '<div class="catalog-material-meta">' + escapeHtml(book ? book.name : '') +
            (entry ? ' · ' + escapeHtml(entry.name) : '') + '</div>' +
        '</div>';
      }

      function openCatalogBook(bookId, focusEntryId) {
        var book = getCatalogBookById(bookId);
        if (!book) { toast('书本不存在'); return; }
        ui.catalogBookId = book.id;
        ui.catalogMaterial = null;
        ui.catalogFocusEntryId = null;
        ui.catalogSearch = '';
        var focusEntry = focusEntryId ? getCatalogEntryById(focusEntryId) : null;
        if (focusEntry && focusEntry.bookId !== book.id) focusEntry = null;
        if (focusEntry) {
          if (focusEntry.status === 'mastered') ui.catalogOnlyUnfinished = false;
          ui.catalogFocusEntryId = focusEntry.id;
        }
        refreshCurrentView(true);
        if (focusEntry) setTimeout(focusCatalogEntry, 80);
      }

      function focusCatalogEntry() {
        var id = ui.catalogFocusEntryId;
        if (!id) return;
        var el = document.querySelector('[data-catalog-entry-id="' + id + '"]');
        ui.catalogFocusEntryId = null;
        if (!el) return;
        try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { el.scrollIntoView(); }
        el.classList.add('is-focused');
        setTimeout(function () {
          if (el) el.classList.remove('is-focused');
        }, 1800);
      }

      function backCatalogBook() {
        revokeCatalogMaterialUrl();
        ui.catalogBookId = null;
        ui.catalogMaterial = null;
        ui.catalogFocusEntryId = null;
        ui.catalogSearch = '';
        refreshCurrentView(true);
      }

      function openCatalogMaterial(entryId, materialId) {
        var entry = getCatalogEntryById(entryId);
        var item = getLibraryItemById(materialId);
        if (!entry || !item) { toast('关联资料不存在'); return; }
        ui.catalogMaterial = { entryId: entry.id, itemId: item.id, bookId: entry.bookId };
        refreshCurrentView(true);
      }

      function backCatalogMaterial() {
        revokeCatalogMaterialUrl();
        ui.catalogMaterial = null;
        refreshCurrentView(true);
      }

      function updateCatalogSearchOnly() {
        var content = document.getElementById('catalog-content');
        if (content) content.innerHTML = renderCatalogShelfContent();
      }

      function toggleCatalogBookStar(book) {
        if (!book) return;
        var old = !!book.starred;
        book.starred = !old;
        book.updatedAt = new Date().toISOString();
        if (!persist()) {
          book.starred = old;
          refreshCurrentView(true);
          return;
        }
        refreshCurrentView(true);
      }

      function toggleCatalogBookPin(book) {
        if (!book) return;
        var old = !!book.pinned;
        book.pinned = !old;
        book.updatedAt = new Date().toISOString();
        if (!persist()) {
          book.pinned = old;
          refreshCurrentView(true);
          return;
        }
        refreshCurrentView(true);
        toast(book.pinned ? '书本已置顶' : '已取消置顶');
      }

      function toggleCatalogEntryStar(entry) {
        if (!entry) return;
        var old = !!entry.starred;
        entry.starred = !old;
        entry.updatedAt = new Date().toISOString();
        if (!persist()) {
          entry.starred = old;
          refreshCurrentView(true);
          return;
        }
        refreshCurrentView(true);
      }

      function unlinkCatalogMaterial(entry, materialId) {
        if (!entry) return;
        var before = Array.isArray(entry.materialIds) ? entry.materialIds.slice() : [];
        entry.materialIds = before.filter(function (id) { return id !== materialId; });
        entry.updatedAt = new Date().toISOString();
        if (!persist()) {
          entry.materialIds = before;
          refreshCurrentView(true);
          return;
        }
        refreshCurrentView(true);
        toast('已解除这条资料关联');
      }

      function openCatalogCoverPreview(book) {

        openModal({
          title: book.name,

      function openCatalogBookModal(bookId) {
        var book = bookId ? getCatalogBookById(bookId) : null;
        var isEdit = !!book;
        var pendingCover = book ? (book.cover || '') : '';

        };

      function openCatalogEntryModal(bookId, entryId) {

                '<button type="button" data-catalog-status="learning"' + (status === 'learning' ? ' class="active"' : '') + '>学习中</button>' +
                '<button type="button" data-catalog-status="mastered"' + (status === 'mastered' ? ' class="active"' : '') + '>已掌握</button>' +

                '<input type="color" class="catalog-color-input" id="cef-color" value="' + escapeHtml(safeCatalogColor(e.color)) + '">' +
                '<div class="catalog-color-desc">用于目录条目卡片上的小圆点标识</div>' +

              '<label class="switch"><input type="checkbox" id="cef-starred"' + (e.starred ? ' checked' : '') + '><span class="switch-track"></span><span class="switch-thumb"></span></label>' +
            '</div>' +

              '<label class="field-label">关联资料库内容</label>' +
              '<div class="catalog-material-options">' + materialsHtml + '</div>' +

          actions: [
            { text: '取消', className: 'btn-secondary' },

              text: isEdit ? '保存' : '添加',
              className: 'btn-primary',
              onClick: function (modal) {
                var name = document.getElementById('cef-name').value.trim();
                var note = document.getElementById('cef-note').value.trim();
                var color = safeCatalogColor(document.getElementById('cef-color').value);
                var starred = document.getElementById('cef-starred').checked;
                var statusValue = getActiveValue(modal, '#cef-status', 'data-catalog-status') || 'todo';
                var materialIds = $$('[data-catalog-material-check]', modal).filter(function (input) {

                  });
                }

                }
                refreshCurrentView(true);
                toast(isEdit ? '目录已保存' : '目录已添加', 'success');
                return true;

          ],
          onMount: function (modal) {
            $$('#cef-status [data-catalog-status]', modal).forEach(function (btn) {

      function openCatalogBookMenu(book) {
        if (!book) return;
        var actions = '<div class="action-list">' +
          '<button type="button" data-catalog-book-action="edit">编辑书本</button>' +
          (book.cover ? '<button type="button" data-catalog-book-action="cover">预览封面</button>' : '') +
          '<button type="button" data-catalog-book-action="star">' + (book.starred ? '取消星标' : '星标书本') + '</button>' +

          title: '书本操作',

              btn.addEventListener('click', function () {
                var action = btn.dataset.catalogBookAction;
                closeModal();

                  if (action === 'edit') openCatalogBookModal(book.id);
                  else if (action === 'cover') openCatalogCoverPreview(book);
                  else if (action === 'star') toggleCatalogBookStar(book);

      function openCatalogEntryMenu(entry) {
        if (!entry) return;
        openModal({
          title: '目录操作',
          body: '<div class="action-list">' +
            '<button type="button" data-catalog-entry-action="edit">编辑目录</button>' +
            '<button type="button" data-catalog-entry-action="star">' + (entry.starred ? '取消星标' : '星标目录') + '</button>' +
            '<button type="button" class="danger" data-catalog-entry-action="delete">删除目录</button>' +
          '</div>',
          actions: [{ text: '取消', className: 'btn-secondary' }],
          onMount: function (modal) {
            $$('[data-catalog-entry-action]', modal).forEach(function (btn) {
              btn.addEventListener('click', function () {
                var action = btn.dataset.catalogEntryAction;
                closeModal();
                setTimeout(function () {
                  if (action === 'edit') openCatalogEntryModal(entry.bookId, entry.id);
                  else if (action === 'star') toggleCatalogEntryStar(entry);
                  else if (action === 'delete') requestDeleteCatalogEntry(entry);
                }, 0);
              });
            });
          }

      function requestDeleteCatalogBook(book) {
        if (!book) return;
        var count = getCatalogEntriesForBook(book.id, true).length;
        confirmDialog({
          title: '删除书本',
          message: '确认删除「' + book.name + '」？' +
            (count ? '\n书本内的 ' + count + ' 条目录会一并删除，资料库内容不受影响。' : ''),
          confirmText: '删除',
          danger: true
        }).then(function (ok) {
          if (!ok) return;
          var snapshot = JSON.parse(JSON.stringify(state.studyCatalog));
          state.studyCatalog.books = state.studyCatalog.books.filter(function (b) { return b.id !== book.id; });
          state.studyCatalog.entries = state.studyCatalog.entries.filter(function (e) { return e.bookId !== book.id; });
          if (ui.catalogBookId === book.id) {
            ui.catalogBookId = null;
            ui.catalogMaterial = null;
            ui.catalogFocusEntryId = null;
          }
          if (!persist()) {
            state.studyCatalog = snapshot;
            refreshCurrentView(true);
            return;
          }
          refreshCurrentView(true);
          toast('书本已删除');
        });
      }

      function requestDeleteCatalogEntry(entry) {
        if (!entry) return;
        confirmDialog({
          title: '删除目录',
          message: '确认删除「' + entry.name + '」？',
          confirmText: '删除',
          danger: true
        }).then(function (ok) {
          if (!ok) return;
          var before = state.studyCatalog.entries.slice();
          state.studyCatalog.entries = state.studyCatalog.entries.filter(function (e) { return e.id !== entry.id; });
          if (!persist()) {
            state.studyCatalog.entries = before;
            refreshCurrentView(true);
            return;
          }
          refreshCurrentView(true);
          toast('目录已删除');
        });
      }

      function startCatalogDrag(handle, e) {
        if (!handle || (e.button !== undefined && e.button !== 0)) return;
        var isBook = handle.hasAttribute('data-catalog-book-drag');
        var selector = isBook ? '[data-catalog-book-id]' : '[data-catalog-entry-id]';
        var row = handle.closest(selector);
        var list = handle.closest(isBook ? '#catalog-book-grid' : '#catalog-entry-list');
        if (!row || !list) return;
        e.preventDefault();
        var ordersBefore = isBook
          ? state.studyCatalog.books.map(function (b) { return { id: b.id, order: b.order }; })
          : state.studyCatalog.entries.map(function (en) { return { id: en.id, order: en.order }; });
        catalogDrag = {
          isBook: isBook,
          row: row,
          list: list,
          selector: selector,
          pinned: isBook ? row.dataset.catalogPinned === '1' : false,
          pointerId: e.pointerId,
          moved: false,
          ordersBefore: ordersBefore
        };
        row.classList.add('is-dragging');
        document.body.classList.add('catalog-dragging');
        document.addEventListener('pointermove', onCatalogDragMove, { passive: false });
        document.addEventListener('pointerup', onCatalogDragEnd);
        document.addEventListener('pointercancel', onCatalogDragEnd);
        try { handle.setPointerCapture(e.pointerId); } catch (err) {}
      }

      function onCatalogDragMove(e) {
        if (!catalogDrag) return;
        if (e.pointerId !== catalogDrag.pointerId) return;
        if (e.cancelable) e.preventDefault();
        var el = document.elementFromPoint(e.clientX, e.clientY);
        var target = el && el.closest ? el.closest(catalogDrag.selector) : null;
        if (!target || target === catalogDrag.row || target.parentNode !== catalogDrag.list) return;
        if (catalogDrag.isBook && (target.dataset.catalogPinned === '1') !== catalogDrag.pinned) return;
        var rect = target.getBoundingClientRect();
        var before = e.clientY < rect.top + rect.height / 2;
        catalogDrag.list.insertBefore(catalogDrag.row, before ? target : target.nextSibling);
        catalogDrag.moved = true;
      }

      function onCatalogDragEnd() {
        if (!catalogDrag) return;
        var drag = catalogDrag;
        catalogDrag = null;
        document.removeEventListener('pointermove', onCatalogDragMove);
        document.removeEventListener('pointerup', onCatalogDragEnd);
        document.removeEventListener('pointercancel', onCatalogDragEnd);
        drag.row.classList.remove('is-dragging');
        document.body.classList.remove('catalog-dragging');
        if (!drag.moved) return;
        var rows = Array.prototype.slice.call(drag.list.querySelectorAll(drag.selector));
        if (drag.isBook) {
          rows.forEach(function (row, index) {
            var book = getCatalogBookById(row.dataset.catalogBookId);
            if (book) {
              book.order = index;
              book.updatedAt = new Date().toISOString();
            }
          });
        } else {
          rows.forEach(function (row, index) {
            var entry = getCatalogEntryById(row.dataset.catalogEntryId);
            if (entry) {
              entry.order = index;
              entry.updatedAt = new Date().toISOString();
            }
          });
        }
        if (!persist()) {
          drag.ordersBefore.forEach(function (snap) {
            if (drag.isBook) {
              var book = getCatalogBookById(snap.id);
              if (book) book.order = snap.order;
            } else {
              var entry = getCatalogEntryById(snap.id);
              if (entry) entry.order = snap.order;
            }
          });
        }
        refreshCurrentView(true);
      }


      /* ---------- 资料库 ---------- */
      function getLibraryFolders() {
        return state.library.folders.slice().sort(function (a, b) {
          return new Date(a.createdAt || 0).getTime() - new Date(b.createdAt || 0).getTime();
        });
      }

      function getLibraryFolderById(id) {
        return state.library.folders.find(function (f) { return f.id === id; }) || null;
      }

      function getLibraryItemById(id) {
        return state.library.items.find(function (i) { return i.id === id; }) || null;
      }

      function getLibraryFolderName(id) {
        var folder = getLibraryFolderById(id);
        return folder ? folder.name : '未分组';
      }

      function getLibraryFolderCount(folderId) {
        if (folderId === 'all') return state.library.items.length;
        if (folderId === 'none') return state.library.items.filter(function (i) { return !i.folderId; }).length;
        return state.library.items.filter(function (i) { return i.folderId === folderId; }).length;
      }

      function formatLibrarySize(bytes) {
        var n = Number(bytes) || 0;
        if (n < 1024) return n + ' B';
        if (n < 1024 * 1024) return Math.max(1, Math.round(n / 1024)) + ' KB';
        return (n / (1024 * 1024)).toFixed(1) + ' MB';
      }

      function getLibraryTypeLabel(type) {
        if (type === 'pdf') return 'PDF';
        if (type === 'image') return '图片';
        return '笔记';
      }

      function getLibraryIconId(type) {
        if (type === 'pdf') return 'i-file';
        if (type === 'image') return 'i-image';
        return 'i-edit';
      }

      function stripLibraryExtension(name, type) {
        var n = String(name || '').trim();
        if (type === 'pdf') return n.replace(/\.pdf$/i, '');
        if (type === 'image') return n.replace(/\.(jpe?g|png|webp|gif|heic|heif)$/i, '');
        return n;
      }

      function ensureLibraryExtension(name, type) {
        var n = String(name || '未命名').trim() || '未命名';
        if (type === 'note') return /\.txt$/i.test(n) ? n : n + '.txt';
        if (type === 'pdf') return /\.pdf$/i.test(n) ? n : n + '.pdf';
        return /\.(jpe?g|png|webp|gif)$/i.test(n) ? n : n + '.jpg';
      }

      function readFileAsDataURL(file) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onerror = function () { reject(new Error('文件读取失败')); };
          reader.onload = function () { resolve(reader.result); };
          reader.readAsDataURL(file);
        });
      }

      function dataUrlToBlob(dataUrl) {
        var parts = String(dataUrl || '').split(',');
        if (parts.length < 2) throw new Error('文件数据无效');
        var mimeMatch = parts[0].match(/:(.*?);/);
        var mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
        var binary = atob(parts[1]);
        var length = binary.length;
        var bytes = new Uint8Array(length);
        for (var i = 0; i < length; i++) bytes[i] = binary.charCodeAt(i);
        return new Blob([bytes], { type: mime });
      }

      function getFilteredLibraryItems() {
        var list = state.library.items.slice();
        if (ui.libraryFolder === 'none') {
          list = list.filter(function (i) { return !i.folderId; });
        } else if (ui.libraryFolder !== 'all') {
          list = list.filter(function (i) { return i.folderId === ui.libraryFolder; });
        }

        var q = ui.librarySearch.trim().toLowerCase();
        if (q) {
          list = list.filter(function (item) {
            return String(item.name || '').toLowerCase().indexOf(q) !== -1 ||
              (item.type === 'note' && String(item.text || '').toLowerCase().indexOf(q) !== -1);
          });
        }

        return list.sort(function (a, b) {
          return new Date(b.updatedAt || b.createdAt || 0).getTime() -
            new Date(a.updatedAt || a.createdAt || 0).getTime();
        });
      }

        var searchValue = escapeHtml(ui.librarySearch);
        var chips = '<button type="button" class="folder-chip' + (ui.libraryFolder === 'all' ? ' active' : '') + '" data-library-folder="all">全部<span class="count">' + getLibraryFolderCount('all') + '</span></button>' +
          '<button type="button" class="folder-chip' + (ui.libraryFolder === 'none' ? ' active' : '') + '" data-library-folder="none">未分组<span class="count">' + getLibraryFolderCount('none') + '</span></button>';
        folders.forEach(function (folder) {

            escapeHtml(folder.name) + '<span class="count">' + getLibraryFolderCount(folder.id) + '</span></button>';
        });

        return '<div class="library-toolbar">' +
          '<div class="search-box">' + icon('i-search') +

          '</div>' +

      function renderLibraryList() {
        if (!state.library.items.length) {
          return '<div class="library-empty">' + icon('i-folder') +

      function renderLibraryItem(item) {

        '</div>';

      function handleLibraryFile(file) {
        if (!file) return;
        var isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
        var isImage = /^image\//.test(file.type) || /\.(jpe?g|png|webp|gif|heic|heif)$/i.test(file.name);

        if (!isPdf && !isImage) {
          toast('只支持 PDF 或图片文件', 'error');
          return;
        }

        if (isPdf) {
          if (file.size > MAX_LIBRARY_PDF_BYTES) {
            toast('PDF 不能超过 2MB，否则本地存储可能不够', 'error', 4000);
            return;
          }
          toast('正在读取 PDF…');
          readFileAsDataURL(file).then(function (dataUrl) {
            openLibraryFileSaveModal({
              type: 'pdf',
              name: stripLibraryExtension(file.name, 'pdf') || '未命名 PDF',
              mime: 'application/pdf',
              size: file.size,
              dataUrl: dataUrl
            });
          }).catch(function (err) {
            toast(err.message || 'PDF 读取失败', 'error');
          });
          return;
        }

        toast('正在压缩图片…');
        compressImage(file).then(function (result) {
          openLibraryFileSaveModal({
            type: 'image',
            name: stripLibraryExtension(file.name, 'image') || '未命名图片',
            mime: 'image/jpeg',
            size: result.bytes,
            dataUrl: result.dataUrl
          });
        }).catch(function (err) {
          toast(err.message || '图片处理失败', 'error', 4000);
        });
      }

          html += '<option value="' + escapeHtml(folder.id) + '"' +
            ((selectedId || '') === folder.id ? ' selected' : '') + '>' +
            escapeHtml(folder.name) + '</option>';
        });
        return html;
      }

          title: '删除资料',

        }).then(function (ok) {

      function openLibraryPreview(item) {
        if (!item) return;
        var objectUrl = null;
        var body = '';

        if (item.type === 'pdf') {
          try {
            objectUrl = URL.createObjectURL(dataUrlToBlob(item.dataUrl));
            body = '<iframe class="library-preview-frame" src="' + escapeHtml(objectUrl) + '" title="' + escapeHtml(item.name) + '"></iframe>' +
              '<div class="library-preview-hint">如果 PDF 预览空白，请点下方“保存到‘文件’”，用系统文件预览打开。</div>';
          } catch (e) {
            body = '<div class="library-empty">PDF 数据无法预览，请尝试保存到“文件”后用系统预览打开。</div>';
          }
        } else if (item.type === 'image') {
          body = '<img class="library-preview-image" src="' + escapeHtml(item.dataUrl) + '" alt="' + escapeHtml(item.name) + '">';
        } else {
          body = '<div class="library-note-preview">' + escapeHtml(item.text || '') + '</div>';
        }

        var saveLabel = item.type === 'note' ? '保存为 txt' : '保存到“文件”';
        openModal({
          title: item.name,
          body: body,
          actions: [
            { text: '关闭', className: 'btn-secondary' },
            {
              text: saveLabel,
              className: 'btn-primary',
              close: false,
              onClick: function () {
                saveLibraryItemToFiles(item);
              }
            }
          ],
          onClose: function () {
            if (objectUrl) {
              try { URL.revokeObjectURL(objectUrl); } catch (e) {}
            }
          }
        });
      }

      function buildLibraryFile(item) {
        if (item.type === 'note') {
          return new File([item.text || ''], ensureLibraryExtension(item.name, 'note'), { type: 'text/plain' });
        }
        var blob = dataUrlToBlob(item.dataUrl);
        return new File([blob], ensureLibraryExtension(item.name, item.type), {
          type: item.mime || blob.type || 'application/octet-stream'
        });
      }

      function downloadLibraryFile(file) {
        var objectUrl = URL.createObjectURL(file);
        var link = document.createElement('a');
        link.href = objectUrl;
        link.download = file.name;
        document.body.appendChild(link);
        link.click();
        if (link.parentNode) link.parentNode.removeChild(link);
        setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 2000);
        toast('已开始下载，可在“文件”App中查看', 'success');
      }

      function saveLibraryItemToFiles(item) {
        if (!item) return;
        try {
          var file = buildLibraryFile(item);
          var canShare = false;
          try {
            canShare = !!(navigator.share && navigator.canShare && navigator.canShare({ files: [file] }));
          } catch (err) {
            canShare = false;
          }

          if (canShare) {
            navigator.share({ files: [file], title: file.name }).then(function () {
              toast('已完成分享/保存', 'success');
            }).catch(function (err) {
              if (err && err.name === 'AbortError') return;
              downloadLibraryFile(file);
            });
            return;
          }

          downloadLibraryFile(file);
        } catch (e) {
          toast('保存失败，请重试', 'error');
        }
      }

      function getBackupFileName(date) {
        var d = date || new Date();
        return 'task-shop-backup-' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) +
          '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + '.json';
      }

      function buildBackupJson(date) {
        return JSON.stringify({
          app: 'task-shop-pwa',
          schemaVersion: 1,
          exportedAt: (date || new Date()).toISOString(),
          data: state
        });
      }

      function updateBackupStatusText() {
        var el = document.getElementById('settings-last-backup');
        if (!el) return;
        el.textContent = state.settings.lastBackupAt
          ? formatTimestampShort(state.settings.lastBackupAt)
          : '尚未备份';
      }

      function markBackupDone() {
        var now = new Date();
        state.settings.lastBackupAt = now.toISOString();
        state.settings.lastBackupDate = dateKey(now);
        persist({ silent: true });
        updateBackupStatusText();
        return now;
      }

      function downloadBackupFile(json, name) {
        var blob = new Blob([json], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = name;
        document.body.appendChild(link);
        link.click();
        if (link.parentNode) link.parentNode.removeChild(link);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      }

      function exportBackupManually() {
        if (!state) return;
        var now = markBackupDone();
        var json = buildBackupJson(now);
        var name = getBackupFileName(now);
        try {
          var file = new File([json], name, { type: 'application/json' });
          var canShare = false;
          try {
            canShare = !!(navigator.share && navigator.canShare && navigator.canShare({ files: [file] }));
          } catch (e) {
            canShare = false;
          }
          if (canShare) {
            navigator.share({ files: [file], title: name }).then(function () {
              toast('备份已完成', 'success');
            }).catch(function (err) {
              if (err && err.name === 'AbortError') return;
              downloadBackupFile(json, name);
              toast('已开始下载备份文件', 'success');
            });
          } else {
            downloadBackupFile(json, name);
            toast('已开始下载备份文件，请在“文件”App中查看', 'success');
          }
        } catch (e) {
          downloadBackupFile(json, name);
          toast('已开始下载备份文件', 'success');
        }
      }

      function maybeAutoBackup() {
        if (!state) return;
        if (state.settings.lastBackupDate === dateKey()) return;
        var now = markBackupDone();
        // iOS 无法在无用户手势时可靠唤起系统“存储到文件”面板，
        // 这里自动触发下载；若被拦截，设置页仍可手动导出到“文件”。
        downloadBackupFile(buildBackupJson(now), getBackupFileName(now));
        toast('已触发今日自动备份；若未保存，请到设置 → 数据备份手动导出', 'success', 6000);
      }

      function handleBackupImport(file) {
        if (!file || !state) return;
        var reader = new FileReader();
        reader.onload = function () {
          var parsed;
          try {
            parsed = JSON.parse(reader.result);
          } catch (e) {
            toast('备份文件不是有效的 JSON', 'error');
            return;
          }
          if (!parsed || typeof parsed !== 'object' || !parsed.data ||
              !Array.isArray(parsed.data.tasks) || !Array.isArray(parsed.data.products)) {
            toast('不是本应用的备份文件', 'error');
            return;
          }
          var timeText = parsed.exportedAt ? formatTimestampShort(parsed.exportedAt) : '未知时间';
          confirmDialog({
            title: '导入备份',
            message: '将用备份数据覆盖当前全部任务、金币、商城、资料库和学习目录。\n备份时间：' + timeText + '\n确认导入吗？',
            confirmText: '导入并覆盖',
            danger: true
          }).then(function (ok) {
            if (!ok) return;
            var previous = state;
            var next = normalizeState(parsed.data);
            state = next;
            if (!persist()) {
              state = previous;
              toast('导入失败，本地存储空间不足', 'error');
              return;
            }
            lastKnownDate = dateKey();
            lastOverdueSignature = getOverdueSignature();
            applyTheme(true);
            location.reload();
          });
        };
        reader.onerror = function () {
          toast('读取备份文件失败', 'error');
        };
        reader.readAsText(file);
      }

            '<br>2. iOS 16.4+ 才支持 Web App 系统通知；' +
            '<br>3. 纯离线单文件无法保证应用关闭后仍准时送达；' +

          '</div>' +
          (supported
            ? '<div class="setting-desc" style="margin-top:10px;">当前系统通知权限：' + (granted ? '已授权' : '未授权') + '</div>'
            : '<div class="setting-desc" style="margin-top:10px;">当前浏览器不支持系统通知，将只使用应用内提醒。</div>');

        var actions = [];
        if (supported && !granted) {
          actions.push({
            text: '尝试申请权限',

      function requestNotificationPermission() {
        if (!('Notification' in window) || typeof Notification.requestPermission !== 'function') {
          toast('当前浏览器不支持系统通知，将继续使用应用内提醒', 'error', 4000);
          return;
        }
        try {
          Notification.requestPermission().then(function (permission) {
            if (permission === 'granted') {
              toast('系统通知权限已开启', 'success');
            } else {
              toast('未获得系统通知权限，将继续使用应用内提醒');

            toast('通知权限申请失败，将继续使用应用内提醒', 'error');
          });
        } catch (e) {
          toast('通知权限申请失败，将继续使用应用内提醒', 'error');
        }
      }

        if (!('Notification' in window) || Notification.permission !== 'granted') return;

      function checkReminders() {
        if (!state || !state.settings.notifyEnabled) return;
        var now = new Date();
        var due = state.tasks.filter(function (task) {
          if (task.completed || !task.reminderAt) return false;
          if (task.type === 'cycle' && task.paused) return false;
          if (task.notifiedAt) return false;
          var reminder = parseLocalDateTime(task.reminderAt);
          return !!reminder && reminder.getTime() <= now.getTime();
        });
        if (!due.length) return;

        due.sort(function (a, b) {
          return parseLocalDateTime(a.reminderAt).getTime() - parseLocalDateTime(b.reminderAt).getTime();
        });
        due.forEach(function (task) { task.notifiedAt = now.toISOString(); });
        persist({ silent: true });
        showReminderBanner(due);
        if (due.length === 1) showSystemNotification('任务提醒', due[0].title);
        else showSystemNotification('任务提醒', '有 ' + due.length + ' 个任务提醒已到时间');
      }

      /* ---------- 路由与刷新 ---------- */
      var currentRoute = 'tasks';

      function getRoute() {
        var raw = (location.hash || '').replace(/^#\/?/, '');

      function renderCurrentRouteInto(view) {
        var route = getRoute();
        if (route === 'home') view.innerHTML = renderHomePage();
        else if (route === 'tasks') view.innerHTML = renderTasksPage();
        else if (route === 'library') view.innerHTML = renderLibraryPage();
        else if (route === 'catalog') view.innerHTML = renderCatalogPage();
        else view.innerHTML = renderShopPage();
        document.body.classList.toggle('batch-mode', route === 'tasks' && ui.taskView === 'list' && ui.batchMode);

      function renderRoute() {
        if (!state) return;
        hideChartTooltip();

        var route = getRoute();
        currentRoute = route;
        document.getElementById('page-title').textContent = PAGE_TITLES[route];
        document.title = PAGE_TITLES[route] + ' · 打卡商城';

        $$('.tab').forEach(function (tab) {
          var active = tab.dataset.route === route;
          tab.classList.toggle('active', active);
          if (active) tab.setAttribute('aria-current', 'page');
          else tab.removeAttribute('aria-current');
        });

        var view = document.getElementById('view');
        renderCurrentRouteInto(view);
        window.scrollTo(0, 0);
      }

      function refreshCurrentView(preserveScroll) {
        if (!state) return;
        var y = window.scrollY;
        var view = document.getElementById('view');

        ui.calendarExpanded = !ui.calendarExpanded;
        refreshCurrentView(true);
      }

      /* ---------- 事件绑定 ---------- */
      function onViewClick(e) {
        var target = e.target;

        var actionEl = target.closest('[data-action]');
        if (actionEl) {
          var action = actionEl.dataset.action;
          if (action === 'add-task') { openTaskModal(null); return; }
          if (action === 'toggle-batch') { enterBatch(); return; }
          if (action === 'batch-cancel') { exitBatch(); return; }
          if (action === 'batch-select-all') { selectAllVisible(); return; }
          if (action === 'toggle-calendar') { toggleCalendar(); return; }
          if (action === 'open-ledger') { openTasksSubview('ledger'); return; }
          if (action === 'task-back') { backToTaskList(); return; }
          if (action === 'library-upload') { openLibraryFilePicker(); return; }
          if (action === 'library-new-note') { openLibraryNoteModal(); return; }
          if (action === 'library-folders') { openLibraryFolderManager(); return; }
          if (action === 'catalog-add-book') { openCatalogBookModal(null); return; }
          if (action === 'catalog-back') { backCatalogBook(); return; }
          if (action === 'catalog-add-entry') { openCatalogEntryModal(ui.catalogBookId, null); return; }
          if (action === 'catalog-toggle-unfinished') {
            ui.catalogOnlyUnfinished = !ui.catalogOnlyUnfinished;
            refreshCurrentView(true);
            return;
          }
          if (action === 'catalog-material-back') { backCatalogMaterial(); return; }
          if (action === 'add-product') { openProductModal(null); return; }
          if (action === 'toggle-shop-manage') {
            ui.shopManage = !ui.shopManage;
            refreshCurrentView(true);
            return;
          }
        }

        var catalogOpenBookEl = target.closest('[data-catalog-open-book]');
        if (catalogOpenBookEl) {
          openCatalogBook(catalogOpenBookEl.dataset.catalogOpenBook);
          return;
        }

        var catalogOpenEntryEl = target.closest('[data-catalog-open-entry]');
        if (catalogOpenEntryEl) {
          openCatalogBook(catalogOpenEntryEl.dataset.catalogEntryBook, catalogOpenEntryEl.dataset.catalogOpenEntry);
          return;
        }

        var catalogPreviewCoverEl = target.closest('[data-catalog-preview-cover]');
        if (catalogPreviewCoverEl) {
          var coverBook = getCatalogBookById(catalogPreviewCoverEl.dataset.catalogPreviewCover);
          if (coverBook) openCatalogCoverPreview(coverBook);
          return;
        }

        var catalogBookMenuEl = target.closest('[data-catalog-book-menu]');
        if (catalogBookMenuEl) {
          var menuBook = getCatalogBookById(catalogBookMenuEl.dataset.catalogBookMenu);
          if (menuBook) openCatalogBookMenu(menuBook);
          return;
        }

        var catalogEntryMenuEl = target.closest('[data-catalog-entry-menu]');
        if (catalogEntryMenuEl) {
          var menuEntry = getCatalogEntryById(catalogEntryMenuEl.dataset.catalogEntryMenu);
          if (menuEntry) openCatalogEntryMenu(menuEntry);
          return;
        }

        var catalogStarBookEl = target.closest('[data-catalog-star-book]');
        if (catalogStarBookEl) {
          var starBook = getCatalogBookById(catalogStarBookEl.dataset.catalogStarBook);
          if (starBook) toggleCatalogBookStar(starBook);
          return;
        }

        var catalogStarEntryEl = target.closest('[data-catalog-star-entry]');
        if (catalogStarEntryEl) {
          var starEntry = getCatalogEntryById(catalogStarEntryEl.dataset.catalogStarEntry);
          if (starEntry) toggleCatalogEntryStar(starEntry);
          return;
        }

        var catalogUnlinkEl = target.closest('[data-catalog-unlink-material]');
        if (catalogUnlinkEl) {
          var unlinkEntry = getCatalogEntryById(catalogUnlinkEl.dataset.catalogEntryUnlink);
          if (unlinkEntry) unlinkCatalogMaterial(unlinkEntry, catalogUnlinkEl.dataset.catalogUnlinkMaterial);
          return;
        }

        var catalogMaterialEl = target.closest('[data-catalog-open-material]');
        if (catalogMaterialEl) {
          openCatalogMaterial(catalogMaterialEl.dataset.catalogEntryMaterial, catalogMaterialEl.dataset.catalogOpenMaterial);
          return;
        }

        var libraryOpenEl = target.closest('[data-library-open]');
        if (libraryOpenEl) {
          var libraryItem = getLibraryItemById(libraryOpenEl.dataset.libraryOpen);
          if (libraryItem) openLibraryPreview(libraryItem);
          return;
        }

        var libraryMenuEl = target.closest('[data-library-menu]');
        if (libraryMenuEl) {
          var menuLibraryItem = getLibraryItemById(libraryMenuEl.dataset.libraryMenu);
          if (menuLibraryItem) openLibraryItemMenu(menuLibraryItem);
          return;
        }

        var libraryFolderEl = target.closest('[data-library-folder]');
        if (libraryFolderEl) {
          ui.libraryFolder = libraryFolderEl.dataset.libraryFolder;
          refreshCurrentView(true);
          return;
        }

        var checkEl = target.closest('[data-task-check]');
        if (checkEl) {
          var checkTask = getTaskById(checkEl.dataset.taskCheck);
          if (checkTask) {
            if (checkTask.completed) requestUndoTask(checkTask);
            else requestCompleteTask(checkTask);
          }
          return;
        }

        var menuEl = target.closest('[data-task-menu]');
        if (menuEl) {
          var menuTask = getTaskById(menuEl.dataset.taskMenu);
          if (menuTask) openTaskMenu(menuTask);
          return;
        }

        var selectEl = target.closest('[data-task-select]');
        if (selectEl) {
          toggleTaskSelection(selectEl.dataset.taskSelect);
          return;
        }

        var batchEl = target.closest('[data-batch-action]');
        if (batchEl) {
          if (batchEl.dataset.batchAction === 'complete') batchComplete();
          else if (batchEl.dataset.batchAction === 'delete') batchDelete();
          return;
        }

        var calNav = target.closest('[data-calendar-nav]');
        if (calNav) {
          changeCalendarMonth(Number(calNav.dataset.calendarNav));
          return;
        }

        var calDate = target.closest('[data-calendar-date]');
        if (calDate) {
          // 横向滑动切月后，浏览器可能补发一次点击，忽略这次点击
          if (Date.now() < calendarIgnoreClickUntil) return;
          openDayDetail(calDate.dataset.calendarDate);
          return;
        }

        var ledgerFilter = target.closest('[data-ledger-filter]');
        if (ledgerFilter) {
          ui.ledgerFilter = ledgerFilter.dataset.ledgerFilter;
          refreshCurrentView(true);
          return;
        }

        var redeemEl = target.closest('[data-redeem]');
        if (redeemEl) {
          redeemProduct(redeemEl.dataset.redeem);
          return;
        }

        var undoRedeemEl = target.closest('[data-undo-redemption]');
        if (undoRedeemEl) {
          undoRedemption(undoRedeemEl.dataset.undoRedemption);
          return;
        }

        var editProductEl = target.closest('[data-edit-product]');
        if (editProductEl) {
          openProductModal(editProductEl.dataset.editProduct);
          return;
        }

        var deleteProductEl = target.closest('[data-delete-product]');
        if (deleteProductEl) {
          var product = getProductById(deleteProductEl.dataset.deleteProduct);
          if (product) requestDeleteProduct(product);
          return;
        }

        // 批量模式下点击任务卡片空白处也能选择
        if (ui.batchMode && ui.taskView === 'list' && !target.closest('button')) {
          var card = target.closest('.task-card');
          if (card) toggleTaskSelection(card.dataset.taskId);
        }
      }

      function onViewInput(e) {
        if (e.target && e.target.id === 'task-search') {
          ui.taskSearch = e.target.value;
          updateTaskListOnly();
        }
        if (e.target && e.target.id === 'library-search') {
          ui.librarySearch = e.target.value;
          updateLibraryListOnly();
        }
        if (e.target && e.target.id === 'catalog-search') {
          ui.catalogSearch = e.target.value;
          updateCatalogSearchOnly();
        }
      }

      function onViewChange(e) {
        var shelf = e.target.closest ? e.target.closest('[data-toggle-shelf]') : null;
        if (shelf) {
          toggleProductShelf(shelf.dataset.toggleShelf, shelf.checked);
        }
      }

      function onCatalogPointerDown(e) {
        var handle = e.target.closest ? e.target.closest('[data-catalog-book-drag], [data-catalog-entry-drag]') : null;
        if (!handle) return;
        startCatalogDrag(handle, e);
      }

      function handleAppTick() {
        if (!state || document.visibilityState === 'hidden') return;
        var needsRefresh = false;
        var today = dateKey();
        if (today !== lastKnownDate) {
          lastKnownDate = today;
          needsRefresh = true;
        }
        if (runOverdueCheck()) {
          persist({ silent: true });
          needsRefresh = true;
        }
        var signature = getOverdueSignature();
        if (signature !== lastOverdueSignature) {
          lastOverdueSignature = signature;
          needsRefresh = true;
        }
        if (needsRefresh) refreshCurrentView(true);
        checkReminders();
        maybeAutoBackup();
      }

      function initRoute() {
        var raw = (location.hash || '').replace(/^#\/?/, '');
        var isStandalone = window.navigator.standalone === true ||
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

        // 首次打开（无 hash）默认任务页，不主动改写 URL，避免把 #/home 写进桌面图标地址。
        // 如果从主屏幕启动时旧地址仍带 #/home，也回到任务页。
        if (isStandalone && raw === 'home') {
          history.replaceState(null, '', '#/tasks');
        } else if (raw && ROUTES.indexOf(raw) === -1) {
          history.replaceState(null, '', '#/tasks');
        }

        renderRoute();
      }

      function bindEvents() {
        var settingsBtn = document.getElementById('btn-settings');
        if (settingsBtn) settingsBtn.addEventListener('click', openSettings);

        $$('.tab').forEach(function (tab) {
          tab.addEventListener('click', function () {
            var route = tab.dataset.route;
            if (ROUTES.indexOf(route) === -1) return;
            if (route === 'catalog') {
              revokeCatalogMaterialUrl();
              ui.catalogBookId = null;
              ui.catalogMaterial = null;
              ui.catalogFocusEntryId = null;
              ui.catalogSearch = '';
            }
            if (getRoute() === route) {
              renderRoute();
              return;
            }
            location.hash = '#/' + route;
          });
        });

        window.addEventListener('hashchange', renderRoute);

        var view = document.getElementById('view');
        view.addEventListener('click', onViewClick);
        view.addEventListener('input', onViewInput);
        view.addEventListener('change', onViewChange);
        view.addEventListener('pointerdown', onCatalogPointerDown);

        var libraryFileInput = document.getElementById('library-file-input');
        if (libraryFileInput) {
          libraryFileInput.addEventListener('change', function () {
            var file = libraryFileInput.files && libraryFileInput.files[0];
            libraryFileInput.value = '';
            if (file) handleLibraryFile(file);
          });
        }

        var backupImportInput = document.getElementById('backup-import-input');
        if (backupImportInput) {
          backupImportInput.addEventListener('change', function () {
            var file = backupImportInput.files && backupImportInput.files[0];
            backupImportInput.value = '';
            if (file) handleBackupImport(file);
          });
        }

        // 日历左右滑动
        var calendarTouchX = null;
        view.addEventListener('touchstart', function (e) {
          if (e.target.closest && e.target.closest('#calendar-grid')) {
            calendarTouchX = e.touches[0].clientX;
          }
        }, { passive: true });
        view.addEventListener('touchend', function (e) {
          if (calendarTouchX == null) return;
          var delta = e.changedTouches[0].clientX - calendarTouchX;
          calendarTouchX = null;
          if (Math.abs(delta) > 40) {
            calendarIgnoreClickUntil = Date.now() + 400;
            changeCalendarMonth(delta > 0 ? -1 : 1);
          }
        }, { passive: true });

        // 主页折线图委托
        bindChartEvents();

        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') {
            persist({ silent: true });
          } else {
            handleAppTick();
          }
        });
        window.addEventListener('pagehide', function () {
          if (state) persist({ silent: true });
        });

        if (themeMedia) {
          var onSystemThemeChange = function () {
            if (state && state.settings.themeMode === 'system') applyTheme();
          };
          if (typeof themeMedia.addEventListener === 'function') {
            themeMedia.addEventListener('change', onSystemThemeChange);
          } else if (typeof themeMedia.addListener === 'function') {
            themeMedia.addListener(onSystemThemeChange);
          }
        }
      }

      function boot() {
        state = loadState();
        applyTheme();

        if (runOverdueCheck()) persist({ silent: true });

        bindEvents();
        initRoute();
        lastKnownDate = dateKey();
        lastOverdueSignature = getOverdueSignature();

        try {
          if (!localStorage.getItem(STORAGE_KEY)) {
            if (!persist({ silent: true })) {
              toast('本地存储不可用，数据可能无法保存', 'error', 4000);
            }
          }
        } catch (err) {
          toast('本地存储不可用，数据可能无法保存', 'error', 4000);
        }

        setTimeout(function () { maybeShowDailySummary(); }, 400);
        setTimeout(function () { checkReminders(); }, 900);
        setTimeout(function () { maybeAutoBackup(); }, 1200);
        setInterval(handleAppTick, 30000);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
