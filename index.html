  <!-- 首屏防闪烁：在 CSS 解析前先按本地设置写入主题 -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('task_shop_pwa_v1');
        var parsed = raw ? JSON.parse(raw) : null;
        var mode = parsed && parsed.settings && parsed.settings.themeMode;
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = mode === 'dark' || (mode !== 'light' && prefersDark);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {
        // 忽略首屏主题读取失败，主脚本会再次应用
      }
    })();
  </script>

  <style>
    /* ============================================================
       01. 主题变量
       ============================================================ */
    :root {
      --bg: #f7f5fb;
      --surface: #ffffff;
      --surface-2: #f3effa;
      --surface-3: #eae4f4;
      --text: #30293a;
      --text-secondary: #6d647b;
      --text-tertiary: #a39aaf;
      --border: #eae4f3;
      --primary: #8c76c0;
      --primary-strong: #7e67b2;
      --primary-soft: #f0eaf9;
      --success: #8f7abf;
      --success-solid: #8f7abf;
      --success-soft: #f1ecfa;
      --danger: #b9677a;
      --danger-solid: #b9677a;
      --danger-soft: #fbedf0;
      --warning: #b08b9b;
      --warning-solid: #a57889;
      --warning-soft: #f8eef2;
      --shadow: 0 2px 10px rgba(84, 66, 115, .055), 0 1px 2px rgba(84, 66, 115, .035);
      --shadow-lg: 0 24px 70px rgba(55, 40, 80, .18);
      --radius: 16px;
      --radius-sm: 12px;
      --card-radius: 16px;
      --card-shadow: 0 2px 10px rgba(84, 66, 115, .055), 0 1px 2px rgba(84, 66, 115, .035);
      --ease: cubic-bezier(.22, .8, .26, 1);
      --dur: .32s;
      --nav-height: 56px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }

    :root[data-theme="dark"] {
      --bg: #15121c;
      --surface: #1e1927;
      --surface-2: #282131;
      --surface-3: #332a3f;
      --text: #f2edf8;
      --text-secondary: #bcb2c8;
      --text-tertiary: #8d829b;
      --border: #332b3f;
      --primary: #b7a2dd;
      --primary-strong: #8e76bc;
      --primary-soft: #2b2338;
      --success: #b7a2dd;
      --success-solid: #8e76bc;
      --success-soft: #2b2338;
      --danger: #e3a0ae;
      --danger-solid: #b9677a;
      --danger-soft: #3a2028;
      --warning: #d6b4c2;
      --warning-solid: #a57889;
      --warning-soft: #33252c;
      --shadow: 0 2px 10px rgba(0, 0, 0, .22);
      --shadow-lg: 0 24px 70px rgba(0, 0, 0, .45);
      --card-shadow: 0 2px 10px rgba(0, 0, 0, .18);
    }

    /* ============================================================
       02. 基础重置
       ============================================================ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    /* 弹窗打开时锁住背景滚动 */
    body.modal-open {
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      border: 0;
      background: none;
      padding: 0;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    ul,
    ol {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    svg {
      display: block;
    }

    .icon {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
    }

    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* ============================================================
       03. 应用布局与底部导航
       ============================================================ */
    #app {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: calc(env(safe-area-inset-top) + 8px) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .topbar-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      color: var(--text-secondary);
      background: transparent;
      transition: background .15s, color .15s;
    }

    .icon-btn:active {
      background: var(--surface-2);
      color: var(--text);
    }

    .view {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      flex: 1;
      padding: 16px max(16px, env(safe-area-inset-right)) calc(var(--nav-height) + env(safe-area-inset-bottom) + 24px) max(16px, env(safe-area-inset-left));
    }

    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      height: var(--nav-height);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-tertiary);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .02em;
      transition: color .15s;
    }

    .tab .icon {
      width: 23px;
      height: 23px;
    }

    .tab.active {
      color: var(--primary);
    }

    .tab:active {
      opacity: .65;
    }

    /* ============================================================
       04. 通用卡片、按钮、表单基础
       ============================================================ */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .card + .card {
      margin-top: 12px;
    }

    .btn {
      min-height: 44px;
      padding: 0 16px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      transition: opacity .15s, transform .15s, background .15s;
    }

    .btn:active {
      transform: scale(.98);
      opacity: .8;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-ghost {
      background: transparent;
      color: var(--primary);
    }

    .btn-block {
      width: 100%;
    }

    .btn:disabled {
      opacity: .4;
      pointer-events: none;
    }

    .input,
    .textarea,
    .select {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      color: var(--text);
      font-size: 16px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .textarea {
      min-height: 88px;
      resize: vertical;
      line-height: 1.5;
    }

    .input:focus,
    .textarea:focus,
    .select:focus {
      border-color: var(--primary);
      background: var(--surface);
    }

    .segmented {
      display: flex;
      gap: 2px;
      padding: 3px;
      background: var(--surface-2);
      border-radius: 11px;
    }

    .segmented button {
      flex: 1;
      min-height: 36px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .segmented button.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
    }

    :root[data-theme="dark"] .segmented button.active {
      background: var(--surface-3);
    }

    /* ============================================================
       05. 主页统计、折线图与空状态
       ============================================================ */
    .hero-card {
      position: relative;
      overflow: hidden;
      padding: 20px;
    }

    .hero-card::after {
      content: "";
      position: absolute;
      right: -30px;
      top: -40px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: var(--primary-soft);
      opacity: .8;
      pointer-events: none;
    }

    .hero-label {
      position: relative;
      z-index: 1;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .hero-value {
      position: relative;
      z-index: 1;
      margin-top: 6px;
      font-size: 34px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -.03em;
    }

    .hero-unit {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0;
      color: var(--text-secondary);
    }

    .hero-note {
      position: relative;
      z-index: 1;
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .hero-value.is-negative {
      color: var(--danger);
    }

    .hero-value,
    .stat-value {
      font-variant-numeric: tabular-nums;
    }

    /* 主页统计卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .stat-card {
      min-height: 82px;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .stat-card--wide {
      grid-column: 1 / -1;
    }

    .stat-label {
      font-size: 12px;
      line-height: 1.4;
      color: var(--text-secondary);
    }

    .stat-value {
      margin-top: 5px;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -.02em;
    }

    .stat-unit {
      margin-left: 3px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0;
      color: var(--text-tertiary);
    }

    /* 近 7 天净收益折线图 */
    .chart-card {
      margin-top: 12px;
    }

    .chart-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .chart-title {
      font-size: 15px;
      font-weight: 700;
    }

    .chart-sub {
      margin-top: 3px;
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-tertiary);
    }

    .chart-wrap {
      position: relative;
      margin-top: 8px;
    }

    .chart-svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .chart-zero {
      stroke: var(--border);
      stroke-width: 1;
    }

    .chart-line {
      fill: none;
      stroke: var(--primary);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chart-dot {
      fill: var(--surface);
      stroke: var(--primary);
      stroke-width: 2;
    }

    .chart-hit {
      fill: transparent;
      pointer-events: all;
      cursor: pointer;
      outline: none;
    }

    .chart-hit:focus-visible {
      stroke: var(--primary);
      stroke-width: 2;
    }

    .chart-label {
      fill: var(--text-tertiary);
      font-size: 8.5px;
      font-weight: 500;
    }

    .chart-label.is-today {
      fill: var(--primary);
      font-weight: 700;
    }

    .chart-tooltip {
      position: absolute;
      z-index: 5;
      min-width: 104px;
      max-width: 180px;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--text);
      color: var(--bg);
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .18);
      pointer-events: none;
      transform: translate(-50%, -115%);
    }

    .chart-tooltip[hidden] {
      display: none;
    }

    .chart-tooltip::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -4px;
      width: 8px;
      height: 8px;
      background: var(--text);
      transform: translateX(-50%) rotate(45deg);
    }

    .chart-tooltip-date {
      font-size: 10px;
      opacity: .7;
    }

    .chart-tooltip-value {
      margin-top: 1px;
      font-size: 12px;
    }

    .chart-tooltip-value strong {
      font-size: 14px;
      font-weight: 700;
    }

    .chart-empty {
      margin-top: 4px;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
      color: var(--text-tertiary);
    }

    .fine-print {
      margin-top: 16px;
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
      color: var(--text-tertiary);
    }

    .fine-print + .fine-print {
      margin-top: 2px;
    }

    .empty-state {
      min-height: 52vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-2);
      color: var(--text-tertiary);
    }

    .empty-icon .icon {
      width: 30px;
      height: 30px;
    }

    .empty-state h2 {
      margin-bottom: 6px;
      font-size: 18px;
      font-weight: 700;
    }

    .empty-state p {
      max-width: 280px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    /* ============================================================
       06. 设置弹窗
       ============================================================ */
    .settings-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .setting-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setting-title {
      font-size: 14px;
      font-weight: 600;
    }

    .setting-desc {
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .setting-block .segmented {
      margin-top: 2px;
    }

    .setting-block .btn-block {
      margin-top: 2px;
    }

    /* ============================================================
       06.5 任务、日历、流水、商城、设置扩展
       ============================================================ */
    .hidden {
      display: none !important;
    }

    .library-file-input {
      position: fixed;
      left: -10000px;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .btn-sm {
      min-height: 34px;
      padding: 0 12px;
      font-size: 12px;
      border-radius: 9px;
    }

    .page-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .page-head-title {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 700;
    }

    .page-head .icon-btn {
      width: 36px;
      height: 36px;
    }

    .page-head-spacer {
      width: 36px;
      flex: 0 0 auto;
    }

    .input-with-action {
      display: flex;
      gap: 6px;
    }

    .input-with-action .input {
      flex: 1;
      min-width: 0;
    }

    .input-with-action .btn {
      flex: 0 0 auto;
      width: 44px;
      padding: 0;
    }

    body.batch-mode .task-card {
      cursor: pointer;
    }

    /* 任务列表 */
    .task-toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .search-box {
      position: relative;
    }

    .search-box .icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-tertiary);
      pointer-events: none;
    }

    .search-input {
      padding-left: 38px;
    }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .task-actions .btn-primary {
      flex: 1;
    }

    body.batch-mode .task-actions .btn {
      flex: 1;
    }

    .task-actions .icon-btn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .task-group {
      margin-top: 16px;
    }

    .task-group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 2px 8px;
    }

    .task-group-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .task-group-title .icon {
      width: 14px;
      height: 14px;
    }

    .task-group-count {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .task-card {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 14px 12px 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .task-card + .task-card {
      margin-top: 8px;
    }

    .task-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: var(--priority-color, var(--border));
    }

    .task-card.priority-high {
      --priority-color: var(--danger);
    }

    .task-card.priority-medium {
      --priority-color: var(--warning);
    }

    .task-card.priority-low {
      --priority-color: var(--text-tertiary);
    }

    .task-card.is-completed {
      opacity: .72;
    }

    .task-card.is-selected {
      border-color: var(--primary);
    }

    .task-check {
      position: relative;
      width: 30px;
      height: 30px;
      margin-top: 1px;
      border: 2px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      flex: 0 0 auto;
      background: var(--surface);
    }

    .task-check::before,
    .task-more::before {
      content: "";
      position: absolute;
      inset: -7px;
    }

    .batch-check::before {
      content: "";
      position: absolute;
      inset: -8px;
    }

    .task-check .icon {
      width: 16px;
      height: 16px;
    }

    .task-check.is-completed {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .task-main {
      flex: 1;
      min-width: 0;
    }

    .task-title-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      flex-wrap: wrap;
    }

    .task-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .task-title.is-completed {
      text-decoration: line-through;
      color: var(--text-tertiary);
    }

    .task-pin-icon {
      width: 14px;
      height: 14px;
      margin-top: 3px;
      color: var(--primary);
    }

    .task-badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 10px;
      line-height: 1.5;
      background: var(--surface-2);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .task-badge.overdue {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .task-badge.paused {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .task-badge.cycle {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .task-note {
      margin-top: 3px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 10px;
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .task-meta .danger {
      color: var(--danger);
    }

    .task-reward {
      font-size: 12px;
      font-weight: 700;
    }

    .task-reward.income {
      color: var(--success);
    }

    .task-reward.expense {
      color: var(--danger);
    }

    .task-reward.zero {
      color: var(--text-tertiary);
    }

    .task-more {
      position: relative;
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      color: var(--text-tertiary);
    }

    .task-undo {
      padding: 2px 0 0;
      font-size: 11px;
      color: var(--primary);
    }

    .batch-check {
      position: relative;
      width: 24px;
      height: 24px;
      margin-top: 3px;
      border: 2px solid var(--border);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      flex: 0 0 auto;
      background: var(--surface);
    }

    .batch-check.is-selected {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .batch-check .icon {
      width: 14px;
      height: 14px;
    }

    .task-empty {
      padding: 48px 16px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: 13px;
      line-height: 1.7;
    }

    .task-empty .icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 12px;
      color: var(--text-tertiary);
    }

    .batch-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(var(--nav-height) + env(safe-area-inset-bottom));
      z-index: 45;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
      background: var(--surface);
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 16px rgba(0, 0, 0, .06);
    }

    .batch-count {
      margin-right: auto;
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .batch-bar .btn {
      min-height: 38px;
      padding: 0 12px;
      font-size: 12px;
    }

    body.batch-mode .view {
      padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom) + 92px);
    }

    /* 表单 */
    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field-label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .field-hint {
      font-size: 10px;
      line-height: 1.5;
      color: var(--text-tertiary);
    }

    .field-error {
      min-height: 14px;
      font-size: 11px;
      line-height: 1.4;
      color: var(--danger);
    }

    .input.invalid,
    .textarea.invalid,
    .select.invalid {
      border-color: var(--danger);
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row > .field {
      flex: 1;
      min-width: 0;
    }

    .form-row > .input {
      flex: 1;
      min-width: 0;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
    }

    .switch-row-text {
      font-size: 13px;
    }

    .switch-row-desc {
      margin-top: 2px;
      font-size: 10px;
      color: var(--text-tertiary);
    }

    .switch {
      position: relative;
      width: 50px;
      height: 30px;
      flex: 0 0 auto;
    }

    .switch input {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .switch-track {
      position: absolute;
      inset: 0;
      border-radius: 15px;
      background: var(--surface-3);
      transition: background .2s;
      pointer-events: none;
    }

    .switch-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .2);
      transition: transform .2s;
      pointer-events: none;
    }

    .switch input:checked ~ .switch-track {
      background: var(--primary);
    }

    .switch input:checked ~ .switch-thumb {
      transform: translateX(20px);
    }

    .cycle-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      border-radius: 10px;
      background: var(--surface-2);
    }

    .cycle-preview {
      font-size: 11px;
      line-height: 1.5;
      color: var(--primary);
    }

    .action-list {
      display: flex;
      flex-direction: column;
    }

    .action-list button {
      min-height: 48px;
      padding: 0 4px;
      text-align: left;
      font-size: 15px;
      border-bottom: 1px solid var(--border);
    }

    .action-list button:last-child {
      border-bottom: 0;
    }

    .action-list button.danger {
      color: var(--danger);
    }

    /* 日详情 */
    .day-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      background: var(--surface-2);
    }

    .day-summary-label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .day-summary-value {
      font-size: 15px;
      font-weight: 700;
    }

    .day-task {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .day-task:last-child {
      border-bottom: 0;
    }

    .day-task-status {
      width: 8px;
      height: 8px;
      margin-top: 5px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--danger);
    }

    .day-task-status.done {
      background: var(--success);
    }

    .day-task-main {
      flex: 1;
      min-width: 0;
    }

    .day-task-title {
      font-size: 13px;
      font-weight: 600;
    }

    .day-task-meta {
      margin-top: 2px;
      font-size: 10px;
      color: var(--text-tertiary);
    }

    /* 日历 */
    .calendar-card {
      padding: 16px;
    }

    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .calendar-title {
      font-size: 16px;
      font-weight: 700;
    }

    .calendar-collapsed-hint {
      margin-top: 8px;
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-tertiary);
    }

    .calendar-month-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
    }

    .calendar-month-row .icon-btn {
      width: 36px;
      height: 36px;
    }

    .calendar-month-label {
      font-size: 14px;
      font-weight: 600;
    }

    .calendar-nav {
      display: flex;
      gap: 4px;
    }

    .calendar-nav .icon-btn {
      width: 36px;
      height: 36px;
    }

    .calendar-weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .calendar-weekdays {
      margin-top: 12px;
    }

    .calendar-weekday {
      padding: 4px 0;
      text-align: center;
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .calendar-grid {
      margin-top: 2px;
      touch-action: pan-y;
    }

    .calendar-cell {
      position: relative;
      min-height: 46px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 13px;
      color: var(--text);
    }

    .calendar-cell.other-month {
      color: var(--text-tertiary);
      opacity: .45;
    }

    .calendar-cell.today {
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
    }

    .calendar-cell:active {
      background: var(--surface-2);
    }

    .calendar-dots {
      display: flex;
      gap: 3px;
      height: 6px;
      margin-top: 2px;
    }

    .calendar-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
    }

    .calendar-dot.red {
      background: var(--danger);
    }

    .calendar-dot.green {
      background: var(--success);
    }

    .calendar-hint {
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
      color: var(--text-tertiary);
    }

    /* 流水 */
    .ledger-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .ledger-tab {
      min-height: 38px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-secondary);
      font-size: 12px;
    }

    .ledger-tab.active {
      background: var(--primary);
      color: #fff;
    }

    .ledger-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ledger-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .ledger-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-2);
      color: var(--text-secondary);
      flex: 0 0 auto;
    }

    .ledger-icon .icon {
      width: 17px;
      height: 17px;
    }

    .ledger-main {
      flex: 1;
      min-width: 0;
    }

    .ledger-title {
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ledger-meta {
      margin-top: 2px;
      font-size: 10px;
      color: var(--text-tertiary);
    }

    .ledger-amount {
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .ledger-amount.income {
      color: var(--success);
    }

    .ledger-amount.expense {
      color: var(--danger);
    }

    .ledger-undo {
      margin-top: 3px;
      font-size: 11px;
      color: var(--primary);
    }

    .ledger-empty {
      padding: 48px 16px;
      text-align: center;
      font-size: 13px;
      color: var(--text-tertiary);
    }

    /* 商城 */
    .shop-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .shop-toolbar .btn-primary {
      flex: 1;
    }

    .product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .product-card {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .product-image {
      width: 100%;
      height: 104px;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-image .icon {
      width: 30px;
      height: 30px;
    }

    .product-body {
      padding: 10px;
    }

    .product-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .product-price {
      margin-top: 2px;
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }

    .product-stock {
      margin-top: 1px;
      font-size: 10px;
      color: var(--text-tertiary);
    }

    .product-body .btn {
      width: 100%;
      margin-top: 8px;
      min-height: 40px;
      font-size: 12px;
      border-radius: 9px;
    }

    .limited-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 1;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--warning);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
    }

    .shop-empty {
      padding: 48px 16px;
      text-align: center;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-tertiary);
    }

    .shop-empty .icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 12px;
      color: var(--text-tertiary);
    }

    .manage-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .manage-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .manage-thumb {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: var(--surface-2);
      overflow: hidden;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
    }

    .manage-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .manage-main {
      flex: 1;
      min-width: 0;
    }

    .manage-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .manage-meta {
      margin-top: 2px;
      font-size: 10px;
      color: var(--text-tertiary);
    }

    .manage-actions {
      display: flex;

      display: block;
      max-width: 100%;
      max-height: 60vh;
      margin: 0 auto;
      border-radius: 14px;
    }

    .catalog-material-page .catalog-preview-note {
      max-height: 60vh;
      overflow-y: auto;
      padding: 14px;
      border-radius: 14px;
      background: var(--surface-2);
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .catalog-material-meta {
      margin-top: 8px;
      font-size: 10px;
      line-height: 1.5;
      text-align: center;
      color: var(--text-tertiary);
    }

    /* 封面/关联资料选择 */
    .catalog-cover-picker {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .catalog-cover-preview {
      width: 64px;
      height: 84px;
      border-radius: 10px;
      overflow: hidden;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .catalog-cover-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .catalog-cover-preview .icon {
      width: 24px;
      height: 24px;
    }

    .catalog-cover-picker-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .catalog-color-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .catalog-color-input {
      width: 46px;
      height: 38px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }

    .catalog-color-desc {
      font-size: 10px;
      line-height: 1.5;
      color: var(--text-tertiary);
    }

    .catalog-material-options {
      max-height: 220px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 6px;
      background: var(--surface-2);
      border-radius: 12px;
    }

    .catalog-material-option {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 7px 8px;
      border-radius: 9px;
      background: var(--surface);
      font-size: 12px;
    }

    .catalog-material-option input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary-strong);
      flex: 0 0 auto;
    }

    .catalog-material-option-main {
      flex: 1;
      min-width: 0;
    }

    .catalog-material-option-name {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .catalog-material-option-meta {
      display: block;
      margin-top: 1px;
      font-size: 9px;
      color: var(--text-tertiary);
    }

    .catalog-material-options-empty {
      padding: 14px;
      text-align: center;
      font-size: 11px;
      line-height: 1.6;
      color: var(--text-tertiary);
    }

    body.catalog-dragging {
      user-select: none;
      -webkit-user-select: none;
    }


    /* ============================================================
       07. 统一弹窗与 Toast
       ============================================================ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      background: rgba(0, 0, 0, .45);
      overscroll-behavior: contain;
      animation: backdrop-in .12s ease-out;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      max-height: 85dvh;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: 18px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: modal-in .16s ease-out;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 14px 6px 18px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
    }

    .modal-head .icon-btn {
      width: 36px;
      height: 36px;
    }

    .modal-body {
      padding: 8px 18px 18px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      padding: 0 18px 18px;
    }

    .modal-actions .btn {
      flex: 1;
    }

    .confirm-text {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-secondary);
      white-space: pre-wrap;
    }

    .toast-root {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(var(--nav-height) + env(safe-area-inset-bottom) + 16px);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
      pointer-events: none;
    }

    .toast {
      max-width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(28, 28, 30, .94);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.45;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .2s, transform .2s;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-success {
      background: var(--success);
    }

    .toast-error {
      background: var(--danger);
    }

    @keyframes backdrop-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modal-in {
      from { opacity: 0; transform: scale(.97) translateY(4px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .modal-backdrop,
      .modal {
        animation: none;
      }

      .toast {
        transition: none;
      }
    }

    /* ============================================================
       08. 淡紫 iOS 视觉统一
       ============================================================ */
    body {
      background: var(--bg);
      color: var(--text);
    }

    ::selection {
      background: rgba(140, 118, 192, .22);
    }

    .topbar {
      background: rgba(247, 245, 251, .88);
      border-bottom-color: rgba(140, 118, 192, .10);
      -webkit-backdrop-filter: blur(18px) saturate(1.04);
      backdrop-filter: blur(18px) saturate(1.04);
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }

    :root[data-theme="dark"] .topbar {
      background: rgba(21, 18, 28, .86);
    }

    .topbar-title {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -.03em;
      color: var(--text);
    }

    .topbar .icon-btn {
      background: rgba(255, 255, 255, .55);
      border: 1px solid rgba(234, 228, 243, .9);
      box-shadow: 0 1px 2px rgba(84, 66, 115, .04);
    }

    :root[data-theme="dark"] .topbar .icon-btn {
      background: rgba(255, 255, 255, .04);
      border-color: var(--border);
      box-shadow: none;
    }

    .tabbar {
      background: rgba(255, 255, 255, .92);
      border-top: 1px solid rgba(140, 118, 192, .10);
      box-shadow: 0 -6px 24px rgba(84, 66, 115, .05);
      -webkit-backdrop-filter: blur(18px) saturate(1.04);
      backdrop-filter: blur(18px) saturate(1.04);
    }

    :root[data-theme="dark"] .tabbar {
      background: rgba(30, 25, 39, .9);
      border-top-color: rgba(183, 162, 221, .12);
      box-shadow: 0 -6px 24px rgba(0, 0, 0, .22);
    }

    .tab {
      color: var(--text-tertiary);
      transition: color var(--dur) var(--ease), opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
    }

    .tab .icon {
      width: 22px;
      height: 22px;
      transition: transform var(--dur) var(--ease);
    }

    .tab.active {
      color: var(--primary);
      font-weight: 600;
    }

    .tab.active .icon {
      transform: translateY(-1px) scale(1.03);
    }

    .tab:active {
      opacity: .7;
      transform: scale(.96);
    }

    .card,
    .task-card,
    .library-item,
    .product-card,
    .stat-card,
    .ledger-item,
    .manage-item,
    .calendar-card,
    .hero-card,
    .chart-card,
    .reminder-banner {
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      background: var(--surface);
      box-shadow: var(--card-shadow);
    }

    .task-card {
      padding: 15px 13px 15px 17px;
      transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }

    .task-card + .task-card {
      margin-top: 10px;
    }

    .task-card::before {
      width: 3px;
      top: 14px;
      bottom: 14px;
    }

    .task-card.is-completed {
      opacity: .62;
    }

    .task-card.is-completed .task-title {
      color: var(--text-tertiary);
    }

    .task-card:active {
      transform: scale(.985);
      opacity: .92;
    }

    .task-card.is-selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(140, 118, 192, .10);
    }

    .task-check {
      border-width: 1.5px;
      background: var(--surface);
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
    }

    .task-check:active {
      transform: scale(.92);
    }

    .task-check.is-completed,
    .batch-check.is-selected {
      background: var(--success-solid);
      border-color: var(--success-solid);
      color: #fff;
    }

    .batch-check {
      border-width: 1.5px;
      border-radius: 7px;
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
    }

    .batch-check:active {
      transform: scale(.92);
    }

    .task-title {
      color: var(--text);
    }

    .task-note {
      color: var(--text-secondary);
    }

    .task-badge {
      border-radius: 7px;
    }

    .task-undo,
    .ledger-undo {
      color: var(--primary-strong);
      transition: opacity var(--dur) var(--ease);
    }

    .task-group {
      margin-top: 18px;
    }

    .task-group-title {
      font-weight: 600;
      color: var(--text);
    }

    .task-group-count {
      color: var(--text-tertiary);
    }

    .library-list,
    .ledger-list,
    .manage-list {
      gap: 10px;
    }

    .library-item {
      padding: 12px;
      transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }

    .library-item:active {
      transform: scale(.988);
      opacity: .92;
    }

    .library-icon {
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .folder-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      box-shadow: 0 1px 2px rgba(84, 66, 115, .035);
      transition: background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
    }

    .folder-chip.active {
      background: var(--primary-strong);
      border-color: var(--primary-strong);
      color: #fff;
    }

    .folder-chip:active {
      transform: scale(.97);
    }

    .folder-chip .count {
      opacity: .68;
    }

    .library-preview-frame,
    .library-preview-image,
    .library-note-preview {
      border-radius: 14px;
    }

    .library-note-preview {
      background: var(--surface-2);
    }

    .product-grid {
      gap: 12px;
    }

    .product-card {
      transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }

    .product-card:active {
      transform: scale(.985);
      opacity: .92;
    }

    .product-image {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .product-body {
      padding: 11px;
    }

    .product-price {
      color: var(--primary-strong);
    }

    .product-body .btn {
      border-radius: 11px;
    }

    .limited-tag {
      background: var(--warning-solid);
      border-radius: 7px;
    }

    .manage-item {
      padding: 12px;
      transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }

    .manage-item:active {
      transform: scale(.988);
      opacity: .92;
    }

    .ledger-item {
      padding: 12px;
      transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }

    .ledger-item:active {
      transform: scale(.988);
      opacity: .92;
    }

    .ledger-tab {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      transition: background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
    }

    .ledger-tab.active {
      background: var(--primary-strong);
      border-color: var(--primary-strong);
      color: #fff;
    }

    .ledger-tab:active {
      transform: scale(.97);
    }

    .ledger-icon {
      border-radius: 11px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .hero-card {
      background: #fbf9fe;
    }

    :root[data-theme="dark"] .hero-card {
      background: var(--surface);
    }

    .hero-card::after {
      background: var(--primary-soft);
      opacity: .7;
    }

    .hero-value {
      font-weight: 700;
      letter-spacing: -.04em;
    }

    .stats-grid {
      gap: 12px;
    }

    .stat-card {
      padding: 15px;
    }

    .chart-tooltip {
      background: #3a3048;
      color: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(50, 35, 75, .18);
    }

    .chart-tooltip::after {
      background: #3a3048;
    }

    .chart-line {
      stroke: var(--primary);
    }

    .chart-dot {
      fill: var(--surface);
      stroke: var(--primary);
    }

    .calendar-card {
      padding: 16px;
    }

    .calendar-grid {
      gap: 3px;
    }

    .calendar-cell {
      min-height: 46px;
      border-radius: 12px;
      background: #fbf9fe;
      transition: background var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease);
    }

    :root[data-theme="dark"] .calendar-cell {
      background: rgba(255, 255, 255, .025);
    }

    .calendar-cell.other-month {
      background: transparent;
      opacity: .42;
    }

    .calendar-cell.today {
      background: var(--primary-soft);
      color: var(--primary-strong);
      font-weight: 700;
      box-shadow: inset 0 0 0 1px rgba(140, 118, 192, .18);
    }

    .calendar-cell:active {
      transform: scale(.94);
      background: var(--surface-2);
    }

    .calendar-dot.green {
      background: var(--success);
    }

    .calendar-dot.red {
      background: var(--danger);
    }

    .calendar-weekday {
      color: var(--text-tertiary);
    }

    .calendar-dot.plan {
      width: 6px;
      height: 6px;
      background: var(--primary-soft);
      border: 1.5px solid var(--primary);
    }

    .task-future-mark {
      width: 30px;
      height: 30px;
      margin-top: 1px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary-soft);
      color: var(--primary);
      flex: 0 0 auto;
    }

    .task-future-mark .icon {
      width: 16px;
      height: 16px;
    }

    .task-badge.plan {
      background: var(--primary-soft);
      color: var(--primary-strong);
    }

    .btn {
      border-radius: 13px;
      font-weight: 600;
      transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }

    .btn:active {
      transform: scale(.97);
      opacity: .86;
    }

    .btn-primary {
      background: var(--primary-strong);
      color: #fff;
      box-shadow: 0 4px 12px rgba(126, 103, 178, .16);
    }

    .btn-primary:active {
      box-shadow: 0 2px 6px rgba(126, 103, 178, .12);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--primary-strong);
      border: 1px solid rgba(140, 118, 192, .28);
    }

    .btn-ghost {
      color: var(--primary-strong);
    }

    .btn-danger {
      background: var(--danger-solid);
      color: #fff;
    }

    .btn:disabled {
      box-shadow: none;
    }

    .btn-sm {
      border-radius: 10px;
    }

    .input,
    .textarea,
    .select {
      background: #fcfbfe;
      border-color: var(--border);
      border-radius: 12px;
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }

    :root[data-theme="dark"] .input,
    :root[data-theme="dark"] .textarea,
    :root[data-theme="dark"] .select {
      background: var(--surface-2);
    }

    .input:focus,
    .textarea:focus,
    .select:focus {

      box-shadow: 0 0 0 3px rgba(140, 118, 192, .10);
    }

    .input::placeholder,
    .textarea::placeholder {

    }

    .segmented {

      border-radius: 12px;

    .segmented button {

      transition: background var(--dur) var(--ease), color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }

    .segmented button.active {
      background: var(--surface);
      color: var(--primary-strong);
      box-shadow: 0 1px 3px rgba(84, 66, 115, .07);
    }

    .switch-track {
      background: var(--surface-3);
      transition: background var(--dur) var(--ease);
    }

    .switch-thumb {
      box-shadow: 0 1px 3px rgba(84, 66, 115, .12);
      transition: transform var(--dur) var(--ease);
    }

    .switch input:checked ~ .switch-track {
      background: var(--primary-strong);
    }

    .cycle-box,
    .day-summary,
    .summary-cell {
      border-radius: 12px;
      background: var(--surface-2);
    }

    .action-list button {
      min-height: 50px;
      transition: background var(--dur) var(--ease), color var(--dur) var(--ease), opacity var(--dur) var(--ease);
    }

    .action-list button:active {
      background: var(--surface-2);
    }

    .action-list button.danger {
      color: var(--danger);
    }

    .empty-icon {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .batch-bar {
      background: var(--surface);
      border-top-color: var(--border);
      box-shadow: 0 -6px 22px rgba(84, 66, 115, .06);
    }

    .reminder-banner {
      box-shadow: 0 8px 26px rgba(84, 66, 115, .10);
    }

    .modal-backdrop {
      background: rgba(38, 29, 52, .30);
      -webkit-backdrop-filter: blur(10px) saturate(1.02);
      backdrop-filter: blur(10px) saturate(1.02);
      animation: backdrop-in .28s var(--ease);
    }

    .modal {
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, .55);
      box-shadow: var(--shadow-lg);
      animation: modal-in .34s var(--ease);
    }

    :root[data-theme="dark"] .modal {
      border-color: var(--border);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .confirm-text {
      color: var(--text-secondary);
    }

    .toast {
      border-radius: 14px;
      background: rgba(47, 40, 58, .95);
      box-shadow: 0 10px 30px rgba(50, 35, 75, .18);
      transition: opacity .3s var(--ease), transform .3s var(--ease);

    .toast-success {
      background: var(--success-solid);
      color: #fff;
    }

    .toast-error {

      color: #fff;
    }

    .view > * {

    }

      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }

    @media (prefers-reduced-motion: reduce) {
      .view > *,
      .calendar-grid,
      .task-card,
      .library-item,
      .product-card,
      .manage-item,
      .ledger-item,
      .catalog-book-card,
      .catalog-entry-card,

      .btn,

      .modal-backdrop,
      .toast {

      }
    }

<body>
  <div id="app">
    <header class="topbar">

  <script>
    (function () {
      'use strict';

      /* ============================================================
         00. 常量、工具函数
         ============================================================ */
      var STORAGE_KEY = 'task_shop_pwa_v1';
      var SCHEMA_VERSION = 1;
      var DEFAULT_CURRENCY = '金币';
      var THEME_MODES = ['system', 'light', 'dark'];
      var ROUTES = ['home', 'tasks', 'library', 'catalog', 'shop'];
      var PAGE_TITLES = { home: '主页', tasks: '任务', library: '资料库', catalog: '学习目录', shop: '商城' };

      function $(selector, root) {
        return (root || document).querySelector(selector);
      }

      function $$(selector, root) {
        return Array.prototype.slice.call((root || document).querySelectorAll(selector));
      }

      // 所有写入 innerHTML 的用户数据都必须先转义，避免 XSS
      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // 生成本地唯一 ID；优先使用 crypto.randomUUID
      function uid(prefix) {
        var random;
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          random = window.crypto.randomUUID().replace(/-/g, '').slice(0, 12);
        } else {
          random = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        }
        return prefix + '_' + random;
      }

      function pad2(n) {
        return String(n).padStart(2, '0');
      }

      // 本地日期键，不能用 toISOString，避免时区导致日期偏移
      function dateKey(date) {
        var d = date || new Date();
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
      }

      // 金额统一保留两位小数，避免 0.1 + 0.2 出现长尾
      function roundAmount(value) {
        var n = Number(value);
        if (!isFinite(n)) return 0;
        return Math.round(n * 100) / 100;
      }

      function formatAmount(value) {
        var n = roundAmount(value);
        if (n === 0) n = 0; // 去掉 -0
        return String(n);
      }

      function formatSignedAmount(value) {
        var n = roundAmount(value);
        return n > 0 ? '+' + formatAmount(n) : formatAmount(n);
      }

      // 返回本地时间的“日期 + 天数”，不修改原日期
      function addDays(date, days) {
        var d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        d.setDate(d.getDate() + days);
        return d;
      }

      function formatShortDate(date) {
        return (date.getMonth() + 1) + '/' + date.getDate();
      }

      function formatTooltipDate(date) {
        return (date.getMonth() + 1) + '月' + date.getDate() + '日';
      }

      function icon(id, className) {
        return '<svg class="icon ' + (className || '') + '" aria-hidden="true"><use href="#' + id + '"></use></svg>';
      }

      /* ============================================================
         01. 存储层
         说明：
         - 所有数据放在一个 localStorage 根键里，方便整体读写和以后迁移；
         - loadState 会对旧数据做字段补全，避免新增字段后旧数据报错；
         - persist 失败时必须给出明确提示，不能静默丢数据。
         ============================================================ */
      var state = null;

      function defaultState() {
        return {
          version: SCHEMA_VERSION,
          settings: {
            currencyName: DEFAULT_CURRENCY,
            themeMode: 'system',
            notifyEnabled: false,
            notifyGuideShown: false,
            dailySummaryEnabled: true,
            summaryLastShownDate: '',
            summarySkippedDate: '',
            lastBackupAt: '',
            lastBackupDate: ''
          },
          stats: {
            totalCompleted: 0,
            completedByDate: {}
          },
          tasks: [],
          products: [],
          transactions: [],
          redemptions: [],
          library: {
            folders: [],
            items: []
          },
          studyCatalog: {
            books: [],
            entries: []
          }
        };
      }

      // 兼容旧数据：每日循环任务自动生成的下一副本，如果还没有 visibleFrom，
      // 按“完成时间的次日 00:00”补上，避免升级后当天仍然显示。
      function backfillDailyCycleVisibility(tasks) {
        return tasks.map(function (task) {
          if (!task || task.type !== 'cycle' || !task.cycle || task.cycle.unit !== 'daily') return task;
          if (!task.generatedFrom || task.completed || task.visibleFrom || !task.createdAt) return task;
          var created = new Date(task.createdAt);
          if (isNaN(created.getTime())) return task;
          var nextDay = new Date(created.getFullYear(), created.getMonth(), created.getDate() + 1, 0, 0, 0, 0);
          task.visibleFrom = toLocalDateTimeString(nextDay);
          return task;
        });
      }

      function normalizeState(input) {
        var base = defaultState();
        if (!input || typeof input !== 'object') return base;

        var settings = Object.assign({}, base.settings, input.settings || {});
        if (THEME_MODES.indexOf(settings.themeMode) === -1) settings.themeMode = 'system';
        if (typeof settings.currencyName !== 'string' || !settings.currencyName.trim()) {
          settings.currencyName = DEFAULT_CURRENCY;
        }
        if (typeof settings.notifyEnabled !== 'boolean') settings.notifyEnabled = false;
        if (typeof settings.notifyGuideShown !== 'boolean') settings.notifyGuideShown = false;
        if (typeof settings.dailySummaryEnabled !== 'boolean') settings.dailySummaryEnabled = true;
        if (typeof settings.lastBackupAt !== 'string') settings.lastBackupAt = '';
        if (typeof settings.lastBackupDate !== 'string') settings.lastBackupDate = '';

        var stats = Object.assign({}, base.stats, input.stats || {});
        if (typeof stats.totalCompleted !== 'number' || !isFinite(stats.totalCompleted)) {
          stats.totalCompleted = 0;
        }
        if (!stats.completedByDate || typeof stats.completedByDate !== 'object' || Array.isArray(stats.completedByDate)) {
          stats.completedByDate = {};
        }

        var library = (input.library && typeof input.library === 'object') ? input.library : {};
        var studyCatalog = (input.studyCatalog && typeof input.studyCatalog === 'object') ? input.studyCatalog : {};

        return {
          version: SCHEMA_VERSION,
          settings: settings,
          stats: stats,
          tasks: backfillDailyCycleVisibility(Array.isArray(input.tasks) ? input.tasks : []),
          products: Array.isArray(input.products) ? input.products : [],
          transactions: Array.isArray(input.transactions) ? input.transactions : [],
          redemptions: Array.isArray(input.redemptions) ? input.redemptions : [],
          library: {
            folders: Array.isArray(library.folders) ? library.folders : [],
            items: Array.isArray(library.items) ? library.items : []
          },
          studyCatalog: {
            books: Array.isArray(studyCatalog.books) ? studyCatalog.books : [],
            entries: Array.isArray(studyCatalog.entries) ? studyCatalog.entries : []
          }
        };
      }

      function loadState() {
        var raw = null;
        try {
          raw = localStorage.getItem(STORAGE_KEY);
        } catch (err) {
          console.error('[存储] 无法访问 localStorage', err);
          return defaultState();
        }

        if (!raw) return defaultState();

        try {
          var parsed = JSON.parse(raw);
          var normalized = normalizeState(parsed);
          // 彻底移除已下线的“待学习”数据，并立即从 localStorage 清掉。
          if (parsed && Object.prototype.hasOwnProperty.call(parsed, 'learning')) {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized));
            } catch (cleanupErr) {
              console.error('[存储] 清理待学习数据失败', cleanupErr);
            }
          }
          return normalized;
        } catch (err) {
          // 数据损坏时保留一份原始副本，再用默认数据恢复，避免页面完全打不开
          console.error('[存储] 数据解析失败，已保留原始数据', err);
          var fresh = defaultState();
          try {
            localStorage.setItem(STORAGE_KEY + '_corrupt_' + Date.now(), raw);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
          } catch (e2) {
            console.error('[存储] 损坏数据备份失败', e2);
          }
          return fresh;
        }
      }

      // 返回 true 表示保存成功；失败时按需给出 Toast 提示
      function persist(options) {
        var silent = !!(options && options.silent);
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          return true;
        } catch (err) {
          console.error('[存储] 保存失败', err);
          if (!silent) {
            toast('保存失败：本地存储空间不足，请删除部分图片后重试', 'error', 4000);
          }
          return false;
        }
      }

      /* ============================================================
         02. 主题
         支持：跟随系统 / 浅色 / 深色。
         系统主题切换在 Safari 可能有缓存延迟，设置里提供“刷新样式”按钮。
         ============================================================ */
      var themeMedia = typeof window.matchMedia === 'function'
        ? window.matchMedia('(prefers-color-scheme: dark)')
        : null;

      function effectiveTheme() {
        var mode = state && state.settings ? state.settings.themeMode : 'system';
        if (mode === 'light' || mode === 'dark') return mode;
        return themeMedia && themeMedia.matches ? 'dark' : 'light';
      }

      function applyTheme(force) {
        var theme = effectiveTheme();
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;

        var meta = document.getElementById('meta-theme-color');
        if (meta) {
          meta.setAttribute('content', theme === 'dark' ? '#15121c' : '#f7f5fb');
        }

        // 强制读取一次布局，让 Safari 立即重算 CSS 变量
        if (force) {
          void root.offsetHeight;
        }

        updateThemeSegmented();
      }

      function updateThemeSegmented() {
        var wrap = document.getElementById('theme-segmented');
        if (!wrap || !state) return;
        var mode = state.settings.themeMode;
        $$('button[data-theme-mode]', wrap).forEach(function (btn) {
          var active = btn.dataset.themeMode === mode;
          btn.classList.toggle('active', active);
          btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
      }

      function setThemeMode(mode) {
        if (!state || THEME_MODES.indexOf(mode) === -1) return;
        state.settings.themeMode = mode;
        persist({ silent: true });
        applyTheme();
      }

      /* ============================================================
         03. 通用 UI：Toast、弹窗、确认框
         ============================================================ */
      var activeModal = null;
      var lastFocused = null;

      function toast(message, type, duration) {
        var root = document.getElementById('toast-root');
        if (!root) return;

        // 最多同时显示 3 条，避免遮挡页面
        while (root.children.length >= 3) {
          root.removeChild(root.firstElementChild);
        }

        var el = document.createElement('div');
        el.className = 'toast' + (type ? ' toast-' + type : '');
        el.textContent = String(message);
        root.appendChild(el);

        requestAnimationFrame(function () {
          el.classList.add('show');
        });

        var ms = typeof duration === 'number' ? duration : 2400;
        setTimeout(function () {
          el.classList.remove('show');
          setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 220);
        }, ms);
      }

      function openModal(options) {
        closeModal({ silent: true });

        var opts = Object.assign({
          title: '',
          body: '',
          actions: [],
          dismissible: true,
          className: '',
          onClose: null,
          onMount: null
        }, options || {});

        lastFocused = document.activeElement;

        var root = document.getElementById('modal-root');
        var backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        backdrop.innerHTML =
          '<div class="modal ' + escapeHtml(opts.className) + '" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
            '<div class="modal-head">' +
              '<h3 class="modal-title" id="modal-title">' + escapeHtml(opts.title) + '</h3>' +
              '<button type="button" class="icon-btn" data-modal-close aria-label="关闭">' + icon('i-close') + '</button>' +
            '</div>' +
            '<div class="modal-body">' + opts.body + '</div>' +
            (opts.actions.length ? '<div class="modal-actions"></div>' : '') +
          '</div>';
        root.appendChild(backdrop);
        document.body.classList.add('modal-open');

        var modalEl = $('.modal', backdrop);
        var actionsEl = $('.modal-actions', backdrop);

        if (actionsEl) {
          opts.actions.forEach(function (action) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn ' + (action.className || 'btn-secondary');
            btn.textContent = action.text;
            btn.addEventListener('click', function () {
              var shouldClose = true;
              if (typeof action.onClick === 'function') {
                shouldClose = action.onClick(modalEl) !== false;
              }
              if (shouldClose && action.close !== false) closeModal();
            });
            actionsEl.appendChild(btn);
          });
        }

        var closeBtn = $('[data-modal-close]', backdrop);
        if (opts.dismissible) {
          closeBtn.addEventListener('click', function () { closeModal(); });
          backdrop.addEventListener('click', function (e) {
            if (e.target === backdrop) closeModal();
          });
        } else {
          closeBtn.style.display = 'none';
        }

        activeModal = { backdrop: backdrop, opts: opts, closed: false };
        document.addEventListener('keydown', onModalKeydown);

        if (typeof opts.onMount === 'function') opts.onMount(modalEl);

        var focusable = modalEl.querySelector('button, input, select, textarea, [tabindex]:not([tabindex="-1"])');
        if (focusable) {
          try {
            focusable.focus({ preventScroll: true });
          } catch (e) {
            focusable.focus();
          }
        }

        return { el: modalEl, backdrop: backdrop, close: closeModal };
      }

      function closeModal(options) {
        if (!activeModal) return;
        var current = activeModal;
        if (current.closed) return;
        current.closed = true;
        activeModal = null;

        document.removeEventListener('keydown', onModalKeydown);
        if (current.backdrop.parentNode) current.backdrop.parentNode.removeChild(current.backdrop);

        if (!document.querySelector('.modal-backdrop')) {
          document.body.classList.remove('modal-open');
        }

        if (lastFocused && typeof lastFocused.focus === 'function') {
          try {
            lastFocused.focus({ preventScroll: true });
          } catch (e) {
            // 元素可能已经随页面重新渲染被移除，忽略即可
          }
        }
        lastFocused = null;

        if (!(options && options.silent) && typeof current.opts.onClose === 'function') {
          current.opts.onClose();
        }
      }

      // 键盘可达性：Esc 关闭、Tab 在弹窗内循环
      function onModalKeydown(e) {
        if (!activeModal) return;

        if (e.key === 'Escape' && activeModal.opts.dismissible) {
          e.preventDefault();
          closeModal();
          return;
        }

        if (e.key !== 'Tab') return;

        var focusables = Array.prototype.slice.call(activeModal.backdrop.querySelectorAll(
          'button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [href], [tabindex]:not([tabindex="-1"])'
        )).filter(function (el) {
          return el.offsetParent !== null;
        });

        if (!focusables.length) return;

        var first = focusables[0];
        var last = focusables[focusables.length - 1];

        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }

      // 统一二次确认弹窗，返回 Promise<boolean>
      function confirmDialog(options) {
        var opts = Object.assign({
          title: '确认操作',
          message: '',
          confirmText: '确认',
          cancelText: '取消',
          danger: false
        }, options || {});

        return new Promise(function (resolve) {
          var settled = false;

          function finish(value) {
            if (settled) return;
            settled = true;
            resolve(value);
          }

          openModal({
            title: opts.title,
            body: '<p class="confirm-text">' + escapeHtml(opts.message) + '</p>',
            dismissible: true,
            actions: [
              { text: opts.cancelText, className: 'btn-secondary', onClick: function () { finish(false); } },
              { text: opts.confirmText, className: opts.danger ? 'btn-danger' : 'btn-primary', onClick: function () { finish(true); } }
            ],
            onClose: function () { finish(false); }
          });
        });
      }

      /* ============================================================
         04. 主页统计与近 7 天折线图
         统计口径（与需求确认一致）：
         - 当前剩余 = 所有流水金额之和
         - 累计获得 = 正向任务奖励之和
         - 已兑换消耗 = 商城兑换支出之和
         - 今日获得 = 今日正向任务奖励之和
         - 今日完成 = stats.completedByDate[今天]
         - 7 天净收益 = 按日期汇总全部流水（含负奖励、逾期扣币、商城兑换）
         ============================================================ */
      function getHomeStats() {
        var txs = Array.isArray(state.transactions) ? state.transactions : [];
        var today = dateKey();
        var balance = 0;
        var totalEarned = 0;
        var totalSpent = 0;
        var todayEarned = 0;

        txs.forEach(function (tx) {
          var amount = Number(tx.amount) || 0;
          balance += amount;

          if (tx.type === 'task_reward' && amount > 0) {
            totalEarned += amount;
            if (tx.dateKey === today) todayEarned += amount;
          }

          if (tx.type === 'redeem') {
            totalSpent += Math.abs(amount);
          }
        });

        var completedByDate = (state.stats && state.stats.completedByDate) || {};

        return {
          balance: roundAmount(balance),
          totalEarned: roundAmount(totalEarned),
          totalSpent: roundAmount(totalSpent),
          totalCompleted: Number(state.stats && state.stats.totalCompleted) || 0,
          todayEarned: roundAmount(todayEarned),
          todayCompleted: Number(completedByDate[today]) || 0
        };
      }

      // 最近 7 天（含今天），按本地日期汇总全部流水
      function getLast7Days() {
        var today = new Date();
        var txs = Array.isArray(state.transactions) ? state.transactions : [];
        var days = [];

        for (var i = 6; i >= 0; i--) {
          var d = addDays(today, -i);
          var key = dateKey(d);
          var net = 0;

          txs.forEach(function (tx) {
            if (tx.dateKey === key) {
              net += Number(tx.amount) || 0;
            }
          });

          days.push({
            date: d,
            key: key,
            net: roundAmount(net)
          });
        }

        return days;
      }

      // 统一计算折线图坐标，渲染和触摸浮窗共用，避免两套算法不一致
      function getChartGeometry(days) {
        var values = days.map(function (d) { return d.net; });
        var min = Math.min.apply(null, values.concat([0]));
        var max = Math.max.apply(null, values.concat([0]));

        // 全部为 0 时给一个上下范围，避免除以 0
        if (min === max) {
          min -= 1;
          max += 1;
        }

        var pad = (max - min) * 0.15;
        min -= pad;
        max += pad;

        var left = 26;
        var right = 294;
        var top = 16;
        var bottom = 104;
        var span = max - min;

        var points = days.map(function (d, index) {
          return {
            x: left + (right - left) * index / (days.length - 1),
            y: bottom - ((d.net - min) / span) * (bottom - top),
            net: d.net,
            date: d.date
          };
        });

        return {
          min: min,
          max: max,
          zeroY: bottom - ((0 - min) / span) * (bottom - top),
          points: points,
          left: left,
          right: right,
          top: top,
          bottom: bottom
        };
      }

      function renderChartSVG(days) {
        var geo = getChartGeometry(days);
        var points = geo.points;

        var path = points.map(function (p, index) {
          return (index === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1);
        }).join(' ');

        var dots = points.map(function (p) {
          return '<circle class="chart-dot" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3.2"></circle>';
        }).join('');

        var hits = points.map(function (p, index) {
          var label = formatTooltipDate(p.date) + '，净收益 ' + formatSignedAmount(p.net);
          return '<circle class="chart-hit" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="15" ' +
            'data-chart-index="' + index + '" tabindex="0" role="button" aria-label="' + escapeHtml(label) + '"></circle>';
        }).join('');

        var labels = points.map(function (p, index) {
          return '<text class="chart-label' + (index === points.length - 1 ? ' is-today' : '') + '" ' +
            'x="' + p.x.toFixed(1) + '" y="128" text-anchor="middle">' + escapeHtml(formatShortDate(p.date)) + '</text>';
        }).join('');

        return (
          '<svg class="chart-svg" viewBox="0 0 320 140" role="img" aria-label="近7天净收益折线图">' +
            '<line class="chart-zero" x1="' + geo.left + '" y1="' + geo.zeroY.toFixed(1) + '" x2="' + geo.right + '" y2="' + geo.zeroY.toFixed(1) + '" stroke-dasharray="3 4"></line>' +
            '<path class="chart-line" d="' + path + '"></path>' +
            dots +
            hits +
            labels +
          '</svg>'
        );
      }

        );

      function hideChartTooltip() {
        var tooltip = document.getElementById('chart-tooltip');
        if (tooltip) tooltip.hidden = true;
      }

      function showChartTooltip(index) {
        var wrap = document.getElementById('chart-wrap');
        var svg = wrap ? wrap.querySelector('.chart-svg') : null;
        var tooltip = document.getElementById('chart-tooltip');
        if (!wrap || !svg || !tooltip) return;

        var days = getLast7Days();
        var geo = getChartGeometry(days);
        var point = geo.points[index];
        if (!point) return;

        tooltip.innerHTML =
          '<div class="chart-tooltip-date">' + escapeHtml(formatTooltipDate(point.date)) + '</div>' +
          '<div class="chart-tooltip-value">净收益 <strong>' + escapeHtml(formatSignedAmount(point.net)) + '</strong> ' +
            escapeHtml(state.settings.currencyName) + '</div>';
        tooltip.hidden = false;

        // SVG 使用 viewBox 等比缩放，这里把坐标换算成容器内的像素位置
        var rect = svg.getBoundingClientRect();
        var left = (point.x / 320) * rect.width;
        var top = (point.y / 140) * rect.height;
        tooltip.style.left = left + 'px';
        tooltip.style.top = top + 'px';

        // 浮窗贴近左右边缘时做一次水平修正，避免超出卡片
        var wrapRect = wrap.getBoundingClientRect();
        var tipRect = tooltip.getBoundingClientRect();
        var delta = 0;
        if (tipRect.left < wrapRect.left + 4) {
          delta = wrapRect.left + 4 - tipRect.left;
        } else if (tipRect.right > wrapRect.right - 4) {
          delta = wrapRect.right - 4 - tipRect.right;
        }
        if (delta) {
          tooltip.style.left = (left + delta) + 'px';
        }
      }

      var lastChartTouchAt = 0;

      function bindChartEvents() {
        var view = document.getElementById('view');
        if (!view) return;

        view.addEventListener('touchstart', function (e) {
          var hit = e.target.closest ? e.target.closest('.chart-hit') : null;
          if (!hit) return;
          lastChartTouchAt = Date.now();
          showChartTooltip(Number(hit.dataset.chartIndex));
        }, { passive: true });

        view.addEventListener('click', function (e) {
          var hit = e.target.closest ? e.target.closest('.chart-hit') : null;
          if (!hit) return;
          // 触摸后浏览器还会补发 click，避免重复触发
          if (Date.now() - lastChartTouchAt < 500) return;
          showChartTooltip(Number(hit.dataset.chartIndex));
        });

        view.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          var hit = e.target.closest ? e.target.closest('.chart-hit') : null;
          if (!hit) return;
          e.preventDefault();
          showChartTooltip(Number(hit.dataset.chartIndex));
        });

        // 点击图表以外的区域时收起浮窗

          if (!e.target.closest || !e.target.closest('.chart-wrap')) {
            hideChartTooltip();
          }
        });
